server:
  port: 8080
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201,http://localhost:4200}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:^172\.28\.0\.10$}
          x-forwarded-request-headers-filter:
            enabled: true
            proto-enabled: true
            proto-append: true
          routes:
            - id: devices-api
              uri: ${DEVICES_INTERNAL_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/devices/**,/api/v1/scenarios/**
              filters:
                - StripPrefix=0

            - id: files-api
              uri: ${FILES_INTERNAL_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/files/**
              filters:
                - StripPrefix=0

            - id: subscription
              uri: ${SUBSCRIPTION_INTERNAL_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/subscriptions/**,/api/v1/subscription-users/**
              filters:
                - StripPrefix=0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URL:http://localhost:9000/oauth2/jwks}
          jwk-set-cache-time-to-live: 60s
          jwk-set-cache-size: 5

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: TRACE
